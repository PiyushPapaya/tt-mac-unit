# Tiny Tapeout project information
project:
  title:        "8-bit MAC Unit"
  author:       "PiyushPapaya"
  discord:      "lil.papayaa"
  description:  "An 8-bit multiply-accumulate (MAC) unit for digital signal processing"
  language:     "Verilog"
  clock_hz:     50000000
  tiles: "1x1"
  top_module:  "tt_um_piyushpapaya_mac"
  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "Operand A bit 0"
  ui[1]: "Operand A bit 1"
  ui[2]: "Operand A bit 2"
  ui[3]: "Operand A bit 3"
  ui[4]: "Operand B bit 0"
  ui[5]: "Operand B bit 1"
  ui[6]: "Operand B bit 2"
  ui[7]: "Operand B bit 3"
  # Outputs
  uo[0]: "Result bit 0"
  uo[1]: "Result bit 1"
  uo[2]: "Result bit 2"
  uo[3]: "Result bit 3"
  uo[4]: "Result bit 4"
  uo[5]: "Result bit 5"
  uo[6]: "Result bit 6"
  uo[7]: "Result bit 7"
  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
